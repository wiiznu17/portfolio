<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="50%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g opacity="0.35" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
  </g>

  <!-- Glass Card in Center -->
  <rect x="220" y="85" width="360" height="280" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />

  <!-- Window Header dots -->
  <circle cx="255" cy="115" r="5" fill="#f87171" />
  <circle cx="273" cy="115" r="5" fill="#fbbf24" />
  <circle cx="291" cy="115" r="5" fill="#34d399" />

  <!-- Code Bracket Icon in Center of Card -->
  <g transform="translate(352, 160)">
    <rect width="96" height="96" rx="20" fill="url(#iconGrad)" filter="url(#shadow)" />
    <!-- </> icon -->
    <path d="M38 36L26 48L38 60" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M58 36L70 48L58 60" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="51" y1="32" x2="45" y2="64" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Coming Soon Text -->
  <text x="400" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="middle" letter-spacing="-0.01em">
    Project Slot Available
  </text>
  <text x="400" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">
    Ready for your next build
  </text>

  <!-- Decorative Sparkles -->
  <path d="M190 140L193 155L208 158L193 161L190 176L187 161L172 158L187 155Z" fill="#818cf8" opacity="0.8" />
  <path d="M610 280L612 292L624 294L612 296L610 308L608 296L596 294L608 292Z" fill="#38bdf8" opacity="0.8" />
</svg>
